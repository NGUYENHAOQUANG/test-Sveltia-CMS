# ==============================================================================
# Sveltia CMS Configuration cho nocodetoolsranked (Astro Project)
# Documentation: https://github.com/sveltia/sveltia-cms
# ==============================================================================

# Backend configuration (Production uses GitHub backend, Local dev uses Local backend)
backend:
  name: github
  repo: NGUYENHAOQUANG/test-Sveltia-CMS
  branch: perf/optimize-performance
  base_url: https://sveltia-cms-auth.smol.ai

# Bật local backend nếu muốn dùng decap-server ở localhost (nếu không bật decap-server thì sẽ tự dùng GitHub backend ở trên)
local_backend: true

# Thư mục lưu trữ media
media_folder: "src/assets/uploads"
public_folder: "@/assets/uploads"

# Quản lý các Collections dữ liệu trong dự án
collections:
  # -------------------------------------------------------------
  # 1. Collection Brands (Thương hiệu đối tác)
  # File location: src/content/brands/*.yaml
  # -------------------------------------------------------------
  - name: "brands"
    label: "Brands (Đối tác)"
    label_singular: "Brand"
    folder: "src/content/brands"
    extension: "yaml"
    format: "yaml"
    create: true
    slug: "{{slug}}"
    summary: "{{name}} - {{affiliateUrl}}"
    fields:
      - { label: "Tên Brand (Nav)", name: "name", widget: "string" }
      - { label: "Logo Brand", name: "logo", widget: "image" }
      - {
          label: "Logo Mobile (Không bắt buộc)",
          name: "logoMobile",
          widget: "image",
          required: false,
        }
      - { label: "Logo Alt Text (Dạng dài cho Toplist)", name: "logoAlt", widget: "string" }
      - {
          label: "Logo Alt Text Short (Dạng ngắn cho Sidebar)",
          name: "logoAltShort",
          widget: "string",
          required: false,
        }
      - { label: "Tên hiển thị Sidebar", name: "sidebarName", widget: "string", required: false }
      - {
          label: "Tên link cuối bài review",
          name: "articleLinkName",
          widget: "string",
          required: false,
        }
      - {
          label: "Side Banner Creative (Hạng 1)",
          name: "sideBanner",
          widget: "image",
          required: false,
        }
      - { label: "Link Affiliate (Nguồn duy nhất)", name: "affiliateUrl", widget: "string" }
      - {
          label: "Dòng chữ Khuyến mãi Carousel Sidebar",
          name: "carouselPromo",
          widget: "string",
          required: false,
        }

  # -------------------------------------------------------------
  # 2. Collection Authors (Tác giả)
  # File location: src/content/authors/*.yaml
  # -------------------------------------------------------------
  - name: "authors"
    label: "Authors (Tác giả)"
    label_singular: "Author"
    folder: "src/content/authors"
    extension: "yaml"
    format: "yaml"
    create: true
    slug: "{{slug}}"
    summary: "{{name}} ({{role}})"
    fields:
      - { label: "Tên tác giả", name: "name", widget: "string" }
      - { label: "Chức danh / Vai trò", name: "role", widget: "string" }
      - { label: "Ảnh đại diện (Avatar)", name: "avatar", widget: "image" }

  # -------------------------------------------------------------
  # 3. Collection Reviews (Bài đánh giá từng Brand - MDX)
  # File location: src/content/reviews/*.mdx
  # -------------------------------------------------------------
  - name: "reviews"
    label: "Reviews (Bài đánh giá)"
    label_singular: "Review"
    folder: "src/content/reviews"
    extension: "mdx"
    format: "frontmatter"
    create: true
    slug: "{{slug}}"
    summary: "{{title}} - [{{brand}}]"
    fields:
      - { label: "SEO Title (<title>)", name: "title", widget: "string" }
      - { label: "Hero Title (<h1>)", name: "heroTitle", widget: "string" }
      - { label: "Meta Description", name: "description", widget: "text" }
      - { label: "Thanh Khuyến Mãi Topbar (Promo)", name: "promo", widget: "string" }
      - { label: "Ngày xuất bản", name: "published", widget: "datetime", required: false }
      - { label: "Ngày cập nhật", name: "updated", widget: "datetime", required: false }
      - {
          label: "Brand liên kết",
          name: "brand",
          widget: "relation",
          collection: "brands",
          search_fields: ["name"],
          value_field: "{{slug}}",
          display_fields: ["name"],
        }
      - {
          label: "Tác giả bài viết",
          name: "author",
          widget: "relation",
          collection: "authors",
          search_fields: ["name"],
          value_field: "{{slug}}",
          display_fields: ["name"],
        }
      - {
          label: "Danh sách Ưu điểm (Pros)",
          name: "pros",
          widget: "list",
          field: { label: "Ưu điểm", name: "item", widget: "string" },
        }
      - {
          label: "Danh sách Nhược điểm (Cons)",
          name: "cons",
          widget: "list",
          field: { label: "Nhược điểm", name: "item", widget: "string" },
        }
      - { label: "Đoạn tóm tắt Summary (Dành cho Drawer Mobile)", name: "summary", widget: "text" }
      - { label: "Nội dung bài viết (MDX Body)", name: "body", widget: "markdown" }

  # -------------------------------------------------------------
  # 4. Collection Pages (Trang đơn: about, terms, privacy, advertiser-disclosure)
  # File location: src/content/pages/*.mdx
  # -------------------------------------------------------------
  - name: "pages"
    label: "Pages (Trang đơn)"
    label_singular: "Page"
    folder: "src/content/pages"
    extension: "mdx"
    format: "frontmatter"
    create: true
    slug: "{{slug}}"
    summary: "{{title}}"
    fields:
      - { label: "SEO Title (<title>)", name: "title", widget: "string" }
      - { label: "Hero Title", name: "heroTitle", widget: "string" }
      - { label: "Hero Mobile Title", name: "heroMobileTitle", widget: "string", required: false }
      - { label: "Meta Description", name: "description", widget: "text" }
      - {
          label: "Kiểu hiển thị Heading",
          name: "headingStyle",
          widget: "select",
          options: ["distinct", "plain"],
          default: "distinct",
        }
      - { label: "Ngày xuất bản", name: "published", widget: "datetime", required: false }
      - { label: "Ngày cập nhật", name: "updated", widget: "datetime", required: false }
      - { label: "Nội dung trang (MDX Body)", name: "body", widget: "markdown" }
